<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0d0d">
    <title>macOS Flip Clock & Timer</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" href="favicon/favicon.ico" sizes="any">
    <link rel="manifest" href="favicon/site.webmanifest">
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.17"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');

        :root {
            --bg-color: #0d0d0d;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --flip-bg: #1a1a1a;
            --flip-text: #e0e0e0;
            --flip-radius: 12px;
            --anim-speed: 0.6s;
            --sep-color: #2a2a2a;
            --text-main: #ffffff;
            --text-dim: #666;

            --unit-h: 110px;
            --unit-w: 75px;
            --font-sz: 80px;
        }

        body.light-theme {
            --bg-color: #f5f5f7;
            --panel-bg: rgba(0, 0, 0, 0.03);
            --flip-bg: #ffffff;
            --flip-text: #1d1d1f;
            --sep-color: #d2d2d7;
            --text-main: #1d1d1f;
            --text-dim: #86868b;
        }

        @media (min-width: 768px) {
            :root {
                --unit-h: 210px;
                --unit-w: 140px;
                --font-sz: 160px;
            }

            body.hide-seconds {
                --unit-h: 260px;
                --unit-w: 180px;
                --font-sz: 200px;
            }
        }

        /* Large Screen / Simulated Fullscreen sizing */
        body.large-view {
            --unit-h: 32vh !important;
            --unit-w: 22vh !important;
            --font-sz: 25vh !important;
            --flip-radius: 28px !important;
        }

        body.large-view.hide-seconds {
            --unit-h: 42vh !important;
            --unit-w: 28vh !important;
            --font-sz: 35vh !important;
            --flip-radius: 36px !important;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .flip-unit {
            position: relative;
            width: var(--unit-w);
            height: var(--unit-h);
            margin: 0 2px;
            border-radius: var(--flip-radius);
            perspective: 1000px;
            transition: width 0.3s ease, height 0.3s ease, box-shadow 0.3s ease;
        }



        @media (min-width: 768px) {
            .flip-unit {
                margin: 0 6px;
            }
        }

        /* Plates */
        .plate {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            background: var(--flip-bg);
            overflow: hidden;
            display: flex;
            justify-content: center;
            color: var(--flip-text);
            transition: background 0.5s ease, color 0.5s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .digit-text {
            position: absolute;
            width: 100%;
            height: var(--unit-h);
            line-height: var(--unit-h);
            text-align: center;
            font-size: var(--font-sz);
            font-weight: 700 !important;
            /* Force bold on both halves */
            left: 0;
            font-variant-numeric: tabular-nums;
            transition: font-size 0.3s ease, line-height 0.3s ease;
        }

        .plate-top {
            top: 0;
            border-radius: var(--flip-radius) var(--flip-radius) 0 0;
            z-index: 1;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .plate-top .digit-text {
            top: 0;
        }

        .plate-bottom {
            bottom: 0;
            border-radius: 0 0 var(--flip-radius) var(--flip-radius);
            z-index: 0;
        }

        .plate-bottom .digit-text {
            top: 0;
            transform: translateY(-50%);
        }

        /* The Animated Flap */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            transform-origin: bottom;
            z-index: 3;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .flap.flipping {
            animation: flip-down var(--anim-speed) cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes flip-down {
            0% {
                transform: rotateX(0deg);
            }

            100% {
                transform: rotateX(-180deg);
            }
        }

        .flap-front,
        .flap-back {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            overflow: hidden;
            backface-visibility: hidden;
            background: var(--flip-bg);
            transition: background 0.5s ease;
            transform: translateZ(0);
        }

        .flap-front {
            z-index: 2;
            border-radius: var(--flip-radius) var(--flip-radius) 0 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .flap-back {
            transform: rotateX(180deg);
            border-radius: 0 0 var(--flip-radius) var(--flip-radius);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .flap-back .digit-text {
            top: 0;
            transform: translateY(-50%);
        }

        /* Navigation & UI */
        .status-pill {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 20px;
            background: var(--panel-bg);
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 100;
        }

        .tab-button {
            transition: all 0.2s ease;
            opacity: 0.3;
            color: var(--text-main);
            font-weight: 700;
        }

        .tab-button.active {
            opacity: 1;
        }

        .timer-input {
            background: var(--flip-bg);
            border: 2px solid var(--sep-color);
            outline: none;
            color: var(--text-main);
            text-align: center;
            border-radius: 12px;
            width: 70px;
            padding: 12px 0;
            font-size: 1.6rem;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        @media (min-width: 768px) {
            .timer-input {
                width: 100px;
                font-size: 2.2rem;
            }
        }

        .sep {
            color: var(--sep-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            font-size: 32px;
            transition: color 0.5s ease;
        }

        @media (min-width: 768px) {
            .sep {
                gap: 40px;
                font-size: 90px;
            }
        }

        body.large-view .sep {
            gap: 6vh !important;
            font-size: 12vh !important;
        }

        #quote-container {
            transition: opacity 0.6s ease;
            max-width: 1000px;
            text-align: center;
            min-height: 120px;
        }

        #quote-text {
            font-size: 1.5rem;
            line-height: 1.5;
            color: var(--text-main);
            opacity: 0.85;
            transition: color 0.5s ease;
        }

        #quote-author {
            font-size: 0.75rem;
            color: var(--text-main);
            opacity: 0.6;
            margin-top: 12px;
            transition: color 0.5s ease;
        }

        @media (min-width: 768px) {
            #quote-container {
                min-height: 160px;
            }

            #quote-text {
                font-size: 2.25rem;
            }

            #quote-author {
                font-size: 1rem;
            }
        }

        @media (min-width: 1024px) {
            #quote-text {
                font-size: 3rem;
            }
        }

        /* Large View styling for simulated/native fullscreen */
        body.large-view #quote-container {
            max-width: 90vw !important;
            min-height: 20vh !important;
        }

        body.large-view #quote-text {
            font-size: 4.5vh !important;
            line-height: 1.4 !important;
        }

        body.large-view #quote-author {
            font-size: 2vh !important;
            margin-top: 2vh !important;
        }

        #date-display {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            opacity: 0.7;
            letter-spacing: 0.3em;
            margin-top: 2rem;
            transition: color 0.5s ease;
        }

        @media (min-width: 768px) {
            #date-display {
                font-size: 1.25rem;
                margin-top: 3rem;
            }
        }

        body.large-view #date-display {
            font-size: 3vh !important;
            margin-top: 5vh !important;
        }





        /* Progress Bar styles */
        #progress-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 250;
        }

        .light-theme #progress-bar-container {
            background: rgba(0, 0, 0, 0.05);
        }

        #progress-bar {
            height: 100%;
            width: 100%;
            background-color: #3b82f6;
            transition: width 1s linear, background-color 0.5s ease;
        }

        .rule-input-container {
            max-height: 120px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .rule-input-container::-webkit-scrollbar {
            width: 4px;
        }

        .rule-input-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .rule-input-container::-webkit-scrollbar-thumb {
            background: var(--sep-color);
            border-radius: 4px;
        }

        .rule-item-input {
            background: var(--flip-bg);
            border: 2px solid var(--sep-color);
            outline: none;
            color: var(--text-main);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.825rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .rule-item-input:focus {
            border-color: #3b82f6;
        }

        /* Rules presentation screens break out of #main-panel's max-width so
           longer rules fit on one line on wide displays. */
        .rules-screen {
            width: min(96vw, 1500px);
        }

        /* Pre-Exam Rules Animations */
        @keyframes fadeInPage {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-page {
            animation: fadeInPage 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInRule {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .rules-list-item {
            opacity: 0;
            animation: slideInRule 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Apple/Google Developer continuous background blobs */
        @keyframes rotateBlob {
            0% {
                transform: translate(0px, 0px) rotate(0deg);
            }

            33% {
                transform: translate(30px, -50px) rotate(120deg);
            }

            66% {
                transform: translate(-20px, 20px) rotate(240deg);
            }

            100% {
                transform: translate(0px, 0px) rotate(360deg);
            }
        }

        .developer-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            border-radius: 24px;
            filter: blur(80px);
            opacity: 0.12;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .light-theme .developer-bg {
            opacity: 0.22;
        }

        .blob {
            position: absolute;
            width: 50%;
            height: 50%;
            border-radius: 50%;
            mix-blend-mode: multiply;
        }

        .light-theme .blob {
            mix-blend-mode: normal;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, #3b82f6 0%, rgba(59, 130, 246, 0) 70%);
            animation: rotateBlob 20s infinite alternate ease-in-out;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            background: radial-gradient(circle, #a855f7 0%, rgba(168, 85, 247, 0) 70%);
            animation: rotateBlob 25s infinite alternate-reverse ease-in-out;
        }

        .blob-3 {
            top: 40%;
            left: 30%;
            background: radial-gradient(circle, #14b8a6 0%, rgba(20, 184, 166, 0) 70%);
            animation: rotateBlob 22s infinite alternate ease-in-out;
            animation-delay: -5s;
        }

        .hidden {
            display: none !important;
        }

        .control-btn {
            background: var(--panel-bg);
            color: var(--text-dim);
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(128, 128, 128, 0.15);
            color: var(--text-main);
        }

        .control-btn.active {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        /* Simple / Exam mode segmented toggle */
        .mode-toggle {
            display: inline-flex;
            background: var(--panel-bg);
            border: 1px solid var(--sep-color);
            border-radius: 14px;
            padding: 4px;
            gap: 4px;
        }

        .mode-btn {
            padding: 9px 26px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .mode-btn:hover {
            color: var(--text-main);
        }

        .mode-btn.active {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .mode-desc {
            font-size: 0.72rem;
            color: var(--text-dim);
            text-align: center;
            max-width: 300px;
            line-height: 1.4;
            transition: opacity 0.25s ease;
        }

        /* Collapsible rule sections (Exam mode) */
        .rules-section {
            width: 100%;
        }

        .rules-section-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--flip-bg);
            border: 1px solid var(--sep-color);
            border-radius: 12px;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .rules-section-header:hover {
            border-color: #3b82f6;
        }

        .rules-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .rules-count {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0;
        }

        .rules-chevron {
            color: var(--text-dim);
            transition: transform 0.25s ease;
        }

        .rules-section-header.open .rules-chevron {
            transform: rotate(180deg);
        }

        .rules-section-body {
            padding-top: 12px;
        }

        .policy-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            color: #3b82f6;
            text-decoration: none;
            text-align: center;
            transition: color 0.2s ease;
        }

        .policy-link:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        /* Setup body layout: single stacked column by default; on desktop in
           Exam mode it becomes a 3-column grid (timer / pre-start / post-exam)
           with both rule lists fully expanded so everything is visible at once. */
        #setup-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            align-items: center;
        }

        /* Hide exam-only pieces (rule columns, policy link, reset) in Simple mode. */
        #timer-setup:not(.exam-mode) .exam-section {
            display: none !important;
        }

        @media (min-width: 1024px) {
            #timer-setup.exam-mode {
                max-width: 72rem;
            }

            #timer-setup.exam-mode #setup-grid {
                display: grid;
                /* Narrow timer column; give the pre/post rule columns extra
                   width so more of each rule fits on one line. */
                grid-template-columns: 0.72fr 1.14fr 1.14fr;
                gap: 22px;
                align-items: start;
            }

            /* Fit the duration inputs into the (narrower) timer column. */
            #timer-setup.exam-mode .timer-input {
                width: 70px;
                font-size: 1.7rem;
                padding: 10px 0;
            }

            #timer-setup.exam-mode #duration-row>*+* {
                margin-left: 6px;
            }

            /* Rule lists are always open and never scroll internally on desktop. */
            #timer-setup.exam-mode .rules-section-body {
                display: flex !important;
            }

            #timer-setup.exam-mode .rules-section-header {
                pointer-events: none;
                cursor: default;
            }

            #timer-setup.exam-mode .rules-chevron {
                display: none;
            }

            #timer-setup.exam-mode .rule-input-container {
                max-height: none;
                overflow: visible;
            }

            #timer-setup.exam-mode #setup-footer {
                max-width: 460px;
            }
        }




        /* Reusable Confirmation Modal */
        #confirm-modal {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            animation: modalFade 0.2s ease forwards;
        }

        .modal-card {
            position: relative;
            background: var(--flip-bg);
            color: var(--text-main);
            border: 1px solid var(--sep-color);
            border-radius: 22px;
            padding: 34px 32px 28px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
            animation: modalPop 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modal-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
        }

        .modal-icon.modal-icon-info {
            background: rgba(59, 130, 246, 0.12);
            color: #3b82f6;
        }

        .modal-card h3 {
            margin: 0 0 8px;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .modal-card p {
            margin: 0 0 26px;
            font-size: 0.95rem;
            color: var(--text-dim);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-btn {
            flex: 1;
            padding: 13px 20px;
            border: none;
            border-radius: 13px;
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn-secondary {
            background: rgba(128, 128, 128, 0.15);
            color: var(--text-main);
        }

        .modal-btn-secondary:hover {
            background: rgba(128, 128, 128, 0.28);
        }

        .modal-btn-danger {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        }

        .modal-btn-danger:hover {
            background: #dc2626;
        }

        .modal-btn-primary {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
        }

        .modal-btn-primary:hover {
            background: #2563eb;
        }

        @keyframes modalFade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(12px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- Progress Bar -->
    <div id="progress-bar-container" class="hidden">
        <div id="progress-bar"></div>
    </div>

    <!-- Reusable Confirmation Modal -->
    <div id="confirm-modal" class="hidden">
        <div class="modal-backdrop" onclick="modalCancel()"></div>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
            <div class="modal-icon" id="confirm-modal-icon"></div>
            <h3 id="confirm-modal-title"></h3>
            <p id="confirm-modal-message"></p>
            <div class="modal-actions">
                <button id="confirm-modal-cancel" onclick="modalCancel()"
                    class="modal-btn modal-btn-secondary">Cancel</button>
                <button id="confirm-modal-confirm" onclick="modalConfirm()"
                    class="modal-btn modal-btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    <div id="wake-status" class="status-pill opacity-0 transition-opacity">
        <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>
        Stay Awake
    </div>



    <div id="main-panel" class="w-full max-w-6xl p-4 relative flex flex-col items-center">
        <div class="flex items-center space-x-6 mb-12 z-20">
            <div class="flex items-center space-x-2">
                <button onclick="toggleLargeView()" id="btn-fullscreen" class="control-btn" title="Toggle Large View">
                    <svg id="fullscreen-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path
                            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
                        </path>
                    </svg>
                </button>
                <button onclick="toggleTheme()" class="control-btn" title="Toggle Theme">
                    <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2"></svg>
                </button>
                <button id="toggle-seconds" onclick="toggleSeconds()" class="control-btn active"
                    title="Show/Hide Seconds">

    <script>
        let showSeconds = true;

        function createDigitHTML(id) {
            return `
                <div id="${id}" class="flip-unit">
                    <div class="plate plate-top"><div class="digit-text">0</div></div>
                    <div class="plate plate-bottom"><div class="digit-text">0</div></div>
                    <div class="flap">
                        <div class="flap-front plate-top"><div class="digit-text">0</div></div>
                        <div class="flap-back plate-bottom"><div class="digit-text">0</div></div>
                    </div>
                </div>`;
        }

        const clockIds = ['c-h1', 'c-h2', 'c-m1', 'c-m2', 'c-s1', 'c-s2'];
        const timerIds = ['t-h1', 't-h2', 't-m1', 't-m2', 't-s1', 't-s2'];

        const clockContainer = document.getElementById('clock-digits');
        const timerContainer = document.getElementById('timer-digits');

        clockIds.forEach((id, i) => {
            clockContainer.innerHTML += createDigitHTML(id);
            if (i === 1) clockContainer.innerHTML += `<div id="sep-hm" class="sep"><div>•</div><div>•</div></div>`;
            if (i === 3) clockContainer.innerHTML += `<div id="sep-ms" class="sep"><div>•</div><div>•</div></div>`;
        });
        timerIds.forEach((id, i) => {
            timerContainer.innerHTML += createDigitHTML(id);
            if (i === 1) timerContainer.innerHTML += `<div id="sep-t-hm" class="sep"><div>•</div><div>•</div></div>`;
            if (i === 3) timerContainer.innerHTML += `<div id="sep-t-ms" class="sep"><div>•</div><div>•</div></div>`;
        });

        function flipTo(elementId, nextValue) {
            const unit = document.getElementById(elementId);
            if (!unit) return;

            const bottomStatic = unit.querySelector('.plate-bottom .digit-text');

            // Guard against re-triggering the same flip. The bottom plate isn't
            // committed until 300ms into the animation, so at sub-second poll
            // rates we track the in-flight target synchronously via dataset
            // instead of reading the (still-old) bottom plate.
            const currentValue = unit.dataset.val !== undefined ? unit.dataset.val : bottomStatic.textContent;
            if (currentValue === nextValue) return;
            unit.dataset.val = nextValue;

            const topStatic = unit.querySelector('.plate-top .digit-text');
            const flap = unit.querySelector('.flap');
            const flapFront = unit.querySelector('.flap-front .digit-text');
            const flapBack = unit.querySelector('.flap-back .digit-text');

            topStatic.textContent = nextValue;
            flapFront.textContent = currentValue;
            flapBack.textContent = nextValue;

            flap.classList.remove('flipping');

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    flap.classList.add('flipping');
                });
            });

            setTimeout(() => {
                bottomStatic.textContent = nextValue;
            }, 300);
        }

        function updateClock() {
            const now = new Date();
            const time = [
                String(now.getHours()).padStart(2, '0'),
                String(now.getMinutes()).padStart(2, '0'),
                String(now.getSeconds()).padStart(2, '0')
            ].join('').split('');

            clockIds.forEach((id, i) => {
                if (showSeconds || i < 4) {
                    flipTo(id, time[i]);
                }
            });
            document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase();
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleSeconds() {
            showSeconds = !showSeconds;
            const btn = document.getElementById('toggle-seconds');
            const clockSUnits = [document.getElementById('c-s1'), document.getElementById('c-s2'), document.getElementById('sep-ms')];
            const timerSUnits = [document.getElementById('t-s1'), document.getElementById('t-s2'), document.getElementById('sep-t-ms')];

            btn.classList.toggle('active', showSeconds);
            clockSUnits.forEach(el => el.classList.toggle('hidden', !showSeconds));
            timerSUnits.forEach(el => el.classList.toggle('hidden', !showSeconds));
            document.body.classList.toggle('hide-seconds', !showSeconds);

            updateClock();
            refreshTimerUI();
        }

        let timerInt, timeLeft = 0, isPaused = false, timerDuration = 0, endTime = 0;
        let wakeLock = null, warned5 = false, warned1 = false;

        // Self-contained beep via the Web Audio API — no external sound file,
        // so the alarm still works with no network. The context is unlocked on
        // the (user-gesture) Start click so later beeps are allowed to play.
        let audioCtx = null;
        function initAudio() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) { /* Web Audio unavailable */ }
        }
        function playBeep(times = 1) {
            if (!audioCtx) initAudio();
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            for (let i = 0; i < times; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const start = audioCtx.currentTime + i * 0.28;
                osc.type = 'sine';
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.exponentialRampToValueAtTime(0.4, start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(start);
                osc.stop(start + 0.24);
            }
        }

        // --- Screen Wake Lock: keep the display awake while a timer runs ---
        function setWakeStatus(on) {
            const pill = document.getElementById('wake-status');
            if (pill) pill.style.opacity = on ? '1' : '0';
        }
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    setWakeStatus(true);
                    wakeLock.addEventListener('release', () => setWakeStatus(false));
                }
            } catch (e) {
                setWakeStatus(false);
            }
        }
        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().catch(() => { });
                wakeLock = null;
            }
            setWakeStatus(false);
        }
        // Wake locks drop when the tab is hidden; re-acquire on return if still running.
        document.addEventListener('visibilitychange', () => {
            const running = !document.getElementById('timer-running').classList.contains('hidden');
            if (document.visibilityState === 'visible' && running && !wakeLock) {
                requestWakeLock();
            }
        });

        // --- Persist a running timer so a reload/crash can resume it ---
        function persistTimerState() {
            if (timeLeft > 0) {
                localStorage.setItem('timer_state', JSON.stringify({ endTime, timerDuration, isPaused, timeLeft }));
            }
        }
        function clearTimerState() {
            localStorage.removeItem('timer_state');
        }
        function maybeResumeTimer() {
            let s;
            try { s = JSON.parse(localStorage.getItem('timer_state')); } catch (e) { s = null; }
            if (!s) return;
            const remaining = s.isPaused ? s.timeLeft : Math.round((s.endTime - Date.now()) / 1000);
            if (!remaining || remaining <= 0) { clearTimerState(); return; }
            showConfirmModal({
                title: 'Resume timer?',
                message: `A timer was interrupted with ${formatTime(remaining)} remaining.`,
                confirmLabel: 'Resume',
                cancelLabel: 'Discard',
                danger: false,
                icon: 'clock',
                onConfirm: () => doResumeTimer(s, remaining),
                onCancel: clearTimerState
            });
        }
        function doResumeTimer(s, remaining) {
            showTab('timer');
            timerDuration = s.timerDuration;
            timeLeft = remaining;
            isPaused = s.isPaused;
            warned5 = remaining <= 300;
            warned1 = remaining <= 60;
            document.getElementById('timer-setup').classList.add('hidden');
            document.getElementById('progress-bar-container').classList.remove('hidden');
            document.getElementById('timer-digits').classList.remove('hidden');
            document.getElementById('timer-running').classList.remove('hidden');
            document.getElementById('pause-btn').textContent = isPaused ? 'Resume' : 'Pause';
            initAudio();
            requestWakeLock();
            if (isPaused) {
                refreshTimerUI();
                updateProgressBar();
                updateTitle();
            } else {
                runTimer();
            }
            updateQuoteVisibility();
        }

        // --- Formatting + tab-title countdown ---
        function formatTime(t) {
            const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
            return (h > 0 ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }
        function updateTitle() {
            const running = !document.getElementById('timer-running').classList.contains('hidden');
            document.title = running
                ? `${isPaused ? '⏸' : '⏳'} ${formatTime(timeLeft)} — Timer`
                : 'macOS Flip Clock & Timer';
        }

        // --- Interval warnings at 5 min and 1 min remaining ---
        function checkWarnings() {
            if (!warned5 && timeLeft <= 300 && timeLeft > 60) { warned5 = true; playBeep(1); }
            if (!warned1 && timeLeft <= 60 && timeLeft > 0) { warned1 = true; playBeep(2); }
        }

        function setPreset(h, m, s) {
            document.getElementById('input-hr').value = String(h).padStart(2, '0');
            document.getElementById('input-min').value = String(m).padStart(2, '0');
            document.getElementById('input-sec').value = String(s).padStart(2, '0');
        }

        function adjustTime(seconds) {
            const timerRunning = !document.getElementById('timer-running').classList.contains('hidden');
            if (!timerRunning) return;

            if (timeLeft + seconds <= 0) {
                timeLeft = 0;
                endTime = Date.now();
                clearInterval(timerInt);
                handleTimerEnd();
            } else {
                timeLeft += seconds;
                endTime += seconds * 1000;
                if (seconds > 0) {
                    timerDuration += seconds;
                }
                // Re-arm warnings if time was added back above a threshold.
                if (timeLeft > 300) warned5 = false;
                if (timeLeft > 60) warned1 = false;
                refreshTimerUI();
                updateProgressBar();
                updateTitle();
                persistTimerState();
            }
        }

        // Default rules carry the matching University of Windsor "Policy on
        // Conduct of Exams and Tests" reference in [brackets]. Section labels

        // A single rule-editor implementation, instantiated once for the
        // pre-start rules and once for the post-exam rules.
        function createRuleEditor(storageKey, containerId, defaults) {
            const editor = { rules: [], storageKey, containerId };
            try {
                const stored = localStorage.getItem(storageKey);
                editor.rules = stored ? JSON.parse(stored) : [...defaults];
            } catch (e) {
                editor.rules = [...defaults];
            }
            return editor;
        }

        function saveRuleEditor(editor) {
            const container = document.getElementById(editor.containerId);
            if (!container) return;
            const inputs = container.querySelectorAll('.rule-item-input');
            editor.rules = Array.from(inputs).map(i => i.value.trim()).filter(v => v !== '');
            localStorage.setItem(editor.storageKey, JSON.stringify(editor.rules));
            updateRuleCount(editor);
        }

        // Keep the count badge in a collapsed section's header current.
        function updateRuleCount(editor) {
            if (!editor.countId) return;
            const el = document.getElementById(editor.countId);
            if (el) el.textContent = editor.rules.length;
        }

        function toggleRulesSection(key) {
            const body = document.getElementById(key + '-rules-body');
            const header = document.getElementById(key + '-rules-header');
            if (!body || !header) return;
            const nowHidden = body.classList.toggle('hidden');
            header.classList.toggle('open', !nowHidden);
            header.setAttribute('aria-expanded', String(!nowHidden));
        }

        function renderRuleEditor(editor) {
            const container = document.getElementById(editor.containerId);
            if (!container) return;
            container.innerHTML = '';
            editor.rules.forEach((rule, idx) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex items-center space-x-2 w-full group';
                itemDiv.innerHTML = `
                    <span class="text-xs font-bold text-gray-500 min-w-[14px]">${idx + 1}.</span>
                    <input type="text" class="rule-item-input flex-1" placeholder="Rule instruction..." value="${rule.replace(/"/g, '&quot;')}">
                    <button type="button" class="rule-delete-btn text-red-500 hover:text-red-400 p-1 rounded hover:bg-red-500/10 transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100 cursor-pointer" title="Delete Rule">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                `;
                itemDiv.querySelector('.rule-item-input').addEventListener('input', () => saveRuleEditor(editor));
                itemDiv.querySelector('.rule-delete-btn').addEventListener('click', () => deleteRuleFromEditor(editor, idx));
                container.appendChild(itemDiv);
            });
            updateRuleCount(editor);
        }

        function addRuleToEditor(editor) {
            saveRuleEditor(editor);
            editor.rules.push('');

            const container = document.getElementById(editor.containerId);
            if (container) {
                const inputs = container.querySelectorAll('.rule-item-input');
                if (inputs.length > 0) inputs[inputs.length - 1].focus();
            }

        function deleteRuleFromEditor(editor, idx) {
            saveRuleEditor(editor);

            document.getElementById('mode-simple').classList.toggle('active', !isExam);

        function clampField(id, max) {
            const el = document.getElementById(id);
            let val = parseInt(el.value, 10);
            if (isNaN(val) || val < 0) val = 0;
            if (val > max) val = max;
            el.value = String(val).padStart(2, '0');
            return val;

        function reviewRulesOrStart() {
            const h = clampField('input-hr', 23);
            const m = clampField('input-min', 59);
            const s = clampField('input-sec', 59);
            timeLeft = (h * 3600) + (m * 60) + s;
            if (timeLeft <= 0) return;

            timerDuration = timeLeft;

            // Simple mode: no rules — go straight to the countdown.
            if (timerMode !== 'exam') {
                beginCountdown();
                return;
            }

            saveRuleEditor(preRules);

            if (preRules.rules.length > 0) {
                const list = document.getElementById('rules-display-list');
                if (list) {
                    list.innerHTML = '';
                    preRules.rules.forEach((rule, idx) => {
                        const li = document.createElement('li');
                        li.textContent = rule;
                        li.className = 'rules-list-item';
                        li.style.animationDelay = `${idx * 100}ms`;
                        list.appendChild(li);
                    });

                document.getElementById('timer-setup').classList.add('hidden');
                document.getElementById('view-rules').classList.remove('hidden');
                updateQuoteVisibility();
            } else {

        function beginCountdown() {
            const viewRules = document.getElementById('view-rules');
            if (viewRules) viewRules.classList.add('hidden');

            updateProgressBar();

            document.getElementById('timer-digits').classList.remove('hidden');
            document.getElementById('timer-running').classList.remove('hidden');
            isPaused = false;
            // Suppress warnings that are already past for the chosen duration.
            warned5 = timeLeft <= 300;
            warned1 = timeLeft <= 60;
            initAudio();
            requestWakeLock();
            runTimer();
            persistTimerState();
            updateQuoteVisibility();

        function showTimerSetup() {

        function updateProgressBar() {
            const percent = timerDuration > 0 ? (timeLeft / timerDuration) * 100 : 0;
            const bar = document.getElementById('progress-bar');
            bar.style.width = `${percent}%`;
            // Warn visually as time runs low: blue -> amber (<=5m) -> red (<=1m).
            bar.style.backgroundColor = timeLeft <= 60 ? '#ef4444' : (timeLeft <= 300 ? '#f59e0b' : '#3b82f6');
        }

        function runTimer() {
            clearInterval(timerInt);
            // Anchor to a wall-clock end time so the countdown stays accurate
            // even when the tab is backgrounded and setInterval is throttled.
            endTime = Date.now() + timeLeft * 1000;
            timerInt = setInterval(() => {
                if (!isPaused) {
                    timeLeft = Math.max(0, Math.round((endTime - Date.now()) / 1000));
                    refreshTimerUI();
                    updateProgressBar();
                    updateTitle();
                    checkWarnings();
                    persistTimerState();
                    if (timeLeft <= 0) {
                        clearInterval(timerInt);
                        handleTimerEnd();
                    }
                }
            }, 250);
            refreshTimerUI();
            updateProgressBar();
            updateTitle();
        }

        function handleTimerEnd() {
            playBeep(3);

            // Clear countdown interval
            clearInterval(timerInt);
            timeLeft = 0;
            timerDuration = 0;
            releaseWakeLock();
            clearTimerState();

            // Hide clock digits, running overlay, progress bar
            document.getElementById('timer-digits').classList.add('hidden');
            document.getElementById('timer-running').classList.add('hidden');
            document.getElementById('progress-bar-container').classList.add('hidden');
            updateTitle();
            updateQuoteVisibility();

            // Simple mode: no post-exam rules — just return to setup.
            if (timerMode !== 'exam') {
                stopTimer();
                return;
            }

            saveRuleEditor(postRules);
            if (postRules.rules.length > 0) {
                // Render and show post exam rules
                const list = document.getElementById('post-rules-display-list');
                if (list) {
                    list.innerHTML = '';
                    postRules.rules.forEach((rule, idx) => {
                        const li = document.createElement('li');
                        li.textContent = rule;
                        li.className = 'rules-list-item';
                        li.style.animationDelay = `${idx * 100}ms`;
                        list.appendChild(li);
                    });
                }
                document.getElementById('timer-setup').classList.add('hidden');
                document.getElementById('view-post-rules').classList.remove('hidden');

                // Reset countdown numbers on background plates
                timerIds.forEach(id => {
                    flipTo(id, '0');
                });
            } else {
                stopTimer();
            }
        }

        function refreshTimerUI() {
            const h = Math.floor(timeLeft / 3600);
            const m = Math.floor((timeLeft % 3600) / 60);
            const s = Math.max(0, timeLeft % 60);
            const timeStr = [String(h).padStart(2, '0'), String(m).padStart(2, '0'), String(s).padStart(2, '0')].join('').split('');
            timerIds.forEach((id, i) => {
                if (showSeconds || i < 4) {
                    flipTo(id, timeStr[i]);
                }
            });
        }

        function showConfirmModal(opts) {

                return; // Ignore if user is typing
            }

            if (e.code === 'Space') {
                e.preventDefault();
                const timerRunning = !document.getElementById('timer-running').classList.contains('hidden');
                if (timerRunning) {
                    togglePause();
                }
            } else if (e.code === 'KeyF') {
                e.preventDefault();
                toggleLargeView();
            } else if (e.code === 'Escape') {
                const timerRunning = !document.getElementById('timer-running').classList.contains('hidden');
                if (timerRunning) {
                    confirmStop();
                }
            } else if (e.code === 'KeyT') {
                e.preventDefault();
                const viewClock = document.getElementById('view-clock');
                if (viewClock.classList.contains('hidden')) {
                    showTab('clock');
                } else {
                    showTab('timer');
                }
            }
        });
    </script>
</body>

</html>
